<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>PuzzleMania - Create Account</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="menu">

        <h1>🧩 PuzzleMania</h1>

        <h2>Create Account</h2>

        <p>Start your puzzle adventure!</p>

        <br>

        <input
            type="text"
            id="displayName"
            placeholder="Display Name"
        >

        <input
            type="text"
            id="signupUsername"
            placeholder="Username"
        >

        <input
            type="password"
            id="signupPassword"
            placeholder="Password"
        >

        <input
            type="password"
            id="confirmPassword"
            placeholder="Confirm Password"
        >

        <br>

        <button onclick="signup()">
            ✨ Create Account
        </button>

        <button onclick="location.href='login.html'">
            🔙 Back to Login
        </button>

    </div>

    <script src="auth.js"></script>

</body>

</html>
