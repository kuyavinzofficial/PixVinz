```

</div>

<!-- =========================================================
     JAVASCRIPT
     ========================================================= -->

<script src="audio.js"></script>

<script src="save.js"></script>

<script>

document.addEventListener(
    "DOMContentLoaded",
    function(){

        // ======================================
        // LEVEL SETTINGS
        // ======================================

        const totalLevels = 200;

        const levelsGrid =
            document.getElementById(
                "levelsGrid"
            );


        // ======================================
        // HIGHEST UNLOCKED LEVEL
        // ======================================

        let unlockedLevel =
            Number(
                localStorage.getItem(
                    "level"
                )
            ) || 1;


        if(unlockedLevel < 1){

            unlockedLevel = 1;

        }


        if(unlockedLevel > totalLevels){

            unlockedLevel = totalLevels;

        }


        // ======================================
        // CREATE LEVEL BUTTONS
        // ======================================

        for(
            let i = 1;
            i <= totalLevels;
            i++
        ){

            const button =
                document.createElement(
                    "button"
                );


            button.type =
                "button";


            button.className =
                "level-button";


            button.textContent =
                i;


            // ==================================
            // COMPLETED
            // ==================================

            const completed =
                localStorage.getItem(
                    "level" +
                    i
                ) === "completed";


            // ==================================
            // UNLOCKED
            // ==================================

            const unlocked =
                i <= unlockedLevel;


            if(completed){

                button.classList.add(
                    "completed"
                );

            }


            if(!unlocked){

                button.classList.add(
                    "locked"
                );

                button.disabled = true;


                button.textContent =
                    "🔒 " + i;

            }


            // ==================================
            // CLICK LEVEL
            // ==================================

            if(unlocked){

                button.addEventListener(
                    "click",
                    function(){

                        if(
                            typeof playClick ===
                            "function"
                        ){

                            playClick();

                        }


                        localStorage.setItem(
                            "level",
                            i
                        );


                        window.location.href =
                            "game.html";

                    }
                );

            }


            levelsGrid.appendChild(
                button
            );

        }


        // ======================================
        // BACK HOME
        // ======================================

        const backHomeBtn =
            document.getElementById(
                "backHomeBtn"
            );


        if(backHomeBtn){

            backHomeBtn.addEventListener(
                "click",
                function(){

                    if(
                        typeof playClick ===
                        "function"
                    ){

                        playClick();

                    }


                    window.location.href =
                        "index.html";

                }
            );

        }


        // ======================================
        // LEVELS MUSIC
        // ======================================
        //
        // main.mp3 is used on the
        // Levels page.
        //

        if(
            typeof playMainMusic ===
            "function"
        ){

            playMainMusic();

        }

    }
);

</script>

</body>

</html>
