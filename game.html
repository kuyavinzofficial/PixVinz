<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PixVinz</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="game">
    <video class="app-logo game-logo" autoplay muted loop playsinline>
        <source src="images/logo.webm" type="video/webm">
    </video>
    
    <h2 id="levelTitle"></h2>

    <div class="stats">
        ⏱ Time: <span id="timer">0</span>s
        <br><br>
        🔄 Moves: <span id="moves">0</span>
        <br><br>
        ⭐ Score: <span id="stars">⭐⭐⭐</span>
    </div>

    <div id="puzzleBoard"></div>

    <button onclick="playClick(); shufflePuzzle()">
        🔀 Shuffle
    </button>

    <button onclick="playClick(); backHome()">
        ⬅ Menu
    </button>
</div>

<!-- ==============================
     Victory Screen
================================ -->
<div id="victoryScreen" class="hidden">
    <div class="victory-box">
        <h1>🎉 LEVEL COMPLETE!</h1>

        <img id="completedImage" src="" alt="Solved Puzzle">

        <div id="starsDisplay">⭐⭐⭐</div>

        <div class="stats">
            <p>⏱ Time: <span id="finalTime">00:00</span></p>
            <p>🔄 Moves: <span id="finalMoves">0</span></p>
            <p>🪙 Reward: +<span id="rewardCoins">40</span> Coins</p>
        </div>

        <button id="nextBtn">➡ Next Level</button>
        <button id="retryBtn">🔄 Play Again</button>
        <button id="homeBtn">🏠 Home</button>
    </div>
</div>

<!-- Utilities & Setup -->
<script src="js/audio.js"></script>
<script src="js/auth.js"></script>
<script src="js/save.js"></script>
<script src="js/records.js"></script> 
<script src="js/helpers.js"></script>
<script src="js/levels.js"></script>
<script src="js/timer.js"></script>

<!-- Board & Puzzle Core Engine -->
<script src="js/board.js"></script>
<script src="js/puzzle.js"></script>
<script src="js/game.js"></script>

<!-- Overlays & Main Entry -->
<script src="js/victory.js"></script>
<script src="js/main.js"></script>

</body>
</html>
