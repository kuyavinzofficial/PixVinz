<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>PuzzleMania</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game">

    <h1>🧩 PuzzleMania</h1>

    <h2 id="levelTitle"></h2>

    <div class="stats">

        ⏱ Time:
        <span id="timer">0</span>s

        <br><br>

        🔄 Moves:
        <span id="moves">0</span>

        <br><br>

        ⭐ Score:
        <span id="stars">⭐⭐⭐</span>

    </div>

    <div id="puzzleBoard"></div>

    <button onclick="playClick(); shufflePuzzle()">
        🔀 Shuffle
    </button>

    <button onclick="playClick(); backHome()">
        ⬅ Menu
    </button>

</div>

<!-- ==============================
     Victory Screen
================================ -->

<div id="victoryScreen" class="hidden">

    <div class="victory-box">

        <h1>🎉 LEVEL COMPLETE!</h1>

        <img
            id="completedImage"
            src=""
            alt="Solved Puzzle">

        <div id="starsDisplay">⭐⭐⭐</div>

        <div class="stats">

            <p>
                ⏱ Time:
                <span id="finalTime">00:00</span>
            </p>

            <p>
                🔄 Moves:
                <span id="finalMoves">0</span>
            </p>

            <p>
                🪙 Reward:
                +<span id="rewardCoins">40</span> Coins
            </p>

        </div>

        <button id="nextBtn">
            ➡ Next Level
        </button>

        <button id="retryBtn">
            🔄 Play Again
        </button>

        <button id="homeBtn">
            🏠 Home
        </button>

    </div>

</div>
    

<script src="audio.js"></script>
<script src="auth.js"></script>
<script src="save.js"></script>
<script src="puzzle.js"></script>
</body>
</html>
