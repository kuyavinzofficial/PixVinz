<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PixVinz - Puzzle Game</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- ============================================================
     GAME SCREEN
============================================================ -->

<div class="game">


    <!-- ========================================================
         LOGO
    ========================================================= -->

    <video
        class="app-logo"
        autoplay
        muted
        loop
        playsinline
    >
        <source
            src="image/logo.webm"
            type="video/webm"
        >
    </video>


    <!-- ========================================================
         LEVEL TITLE
    ========================================================= -->

    <h2 id="levelTitle">
        Level 1
    </h2>


    <!-- ========================================================
         GAME STATISTICS
    ========================================================= -->

    <div class="stats">

        <p>
            ⏱ Time:
            <span id="timer">0</span>s
        </p>

        <p>
            🔄 Moves:
            <span id="moves">0</span>
        </p>

        <p>
            <span id="stars">
                ⭐⭐⭐
            </span>
        </p>

    </div>


    <!-- ========================================================
         PUZZLE BOARD
    ========================================================= -->

    <div id="puzzleBoard"></div>


    <!-- ========================================================
         VICTORY SCREEN
============================================================ -->

    <div
        id="victoryScreen"
        class="hidden"
    >

        <div class="victory-box">


            <!-- ==================================================
                 VICTORY TITLE
            ================================================== -->

            <h1>
                Puzzle Complete!
            </h1>


            <!-- ==================================================
                 COMPLETED IMAGE
            ================================================== -->

            <img
                id="completedImage"
                src=""
                alt="Completed Puzzle"
            >


            <!-- ==================================================
                 STARS
            ================================================== -->

            <div id="starsDisplay">
                ⭐⭐⭐
            </div>


            <!-- ==================================================
                 FINAL RESULTS
            ================================================== -->

            <div class="stats">

                <p>
                    ⏱ Time:
                    <span id="finalTime">
                        0s
                    </span>
                </p>

                <p>
                    🔄 Moves:
                    <span id="finalMoves">
                        0
                    </span>
                </p>

                <p>
                    🪙 Coins:
                    <span id="rewardCoins">
                        0
                    </span>
                </p>

            </div>


            <!-- ==================================================
                 VICTORY BUTTONS
            ================================================== -->

            <button
                id="nextBtn"
                type="button"
            >
                Next Level
            </button>


            <button
                id="retryBtn"
                type="button"
            >
                Retry
            </button>


            <button
                id="homeBtn"
                type="button"
            >
                Home
            </button>


        </div>

    </div>


</div>



<!-- ============================================================
     JAVASCRIPT
============================================================ -->

<script src="js/helpers.js"></script>

<script src="js/levels.js"></script>

<script src="js/timer.js"></script>

<script src="js/board.js"></script>

<script src="js/save.js"></script>

<script src="js/game.js"></script>

<script src="js/records.js"></script>

<script src="js/victory.js"></script>

<script src="audio.js"></script>

<script src="js/main.js"></script>


</body>

</html>
