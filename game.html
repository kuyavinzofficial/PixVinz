<!DOCTYPE html>
<html>

<head>

    <title>PuzzleMania</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="game">

    <h1>🧩 PuzzleMania</h1>

    <h2 id="levelTitle"></h2>

    <div class="stats">

        ⏱ Time:
        <span id="timer">0</span>s

        <br>

        🔄 Moves:
        <span id="moves">0</span>

        <br>

        ⭐ Score:
        <span id="stars">⭐⭐⭐</span>

    </div>

    <div id="puzzleBoard"></div>

    <button onclick="playClick(); shufflePuzzle()">
        🔀 Shuffle
    </button>

    <button onclick="playClick(); backHome()">
        ⬅ Menu
    </button>

</div>

<!-- Audio Manager MUST load first -->
<script src="audio.js"></script>

<!-- Puzzle Logic -->
<script src="puzzle.js"></script>
<div id="victoryScreen" class="hidden">

    <div class="victory-box">

        <h1>🎉 LEVEL COMPLETE!</h1>

        <div id="starsDisplay">⭐⭐⭐</div>

        <div class="stats">

            <p>⏱ Time: <span id="finalTime">00:00</span></p>

            <p>🔄 Moves: <span id="finalMoves">0</span></p>

            <p>🪙 Reward: +<span id="rewardCoins">40</span> Coins</p>

        </div>

        <button id="nextBtn">➡ Next Level</button>

        <button id="retryBtn">🔄 Play Again</button>

        <button id="homeBtn">🏠 Home</button>

    </div>

</div>
</body>

</html>
