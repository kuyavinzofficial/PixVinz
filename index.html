<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>PixVinz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- PIXVINZ OPENING SPLASH -->
    <div id="puzzleSplash">
        <video class="splash-logo" autoplay muted playsinline>
            <source src="images/logo.webm" type="video/webm">
        </video>
    </div>

    <!-- MAIN MENU -->
    <div class="menu">
        <video class="app-logo" autoplay muted loop playsinline>
            <source src="images/logo.webm" type="video/webm">
        </video>

        <div id="playerProfile">
            <h3 id="welcomeText">Welcome!</h3>
            <p id="usernameDisplay"></p>
        </div>

        <p>Piece Together The Fun!</p>

        <button onclick="startGame()">▶ PLAY</button>
        <button onclick="openLevels()">🏆 LEVELS</button>
        <button onclick="openSettings()">⚙ SETTINGS</button>
        <button class="logout-btn" onclick="logout()">🚪 Logout</button>
    </div>

    <!-- SETTINGS POPUP -->
    <div id="settingsPopup" class="popup">
        <div class="popup-box">
            <h2>⚙ Settings</h2>

            <div class="setting-row">
                <span>🎵 Music</span>
                <input type="checkbox" id="musicToggle">
            </div>

            <div class="setting-row">
                <span>🔊 Sound Effects</span>
                <input type="checkbox" id="soundToggle">
            </div>

            <div class="setting-row">
                <span>✨ Animations</span>
                <input type="checkbox" id="animationToggle">
            </div>

            <button onclick="resetProgress()">🗑 Reset Progress</button>
            <button onclick="showAbout()">ℹ About</button>
            <button onclick="closeSettings()">❌ Close</button>
        </div>
    </div>

    <!-- UTILITIES & CORE ENGINE -->
    <script src="js/audio.js"></script>
    <script src="js/levels.js"></script>
    <script src="js/record.js"></script>
    <script src="js/helpers.js"></script>

    <!-- AUTH & USER PROGRESS -->
    <script src="js/auth.js"></script>
    <script src="js/save.js"></script>
    <script src="js/script.js"></script>

    <!-- NAVIGATION & MENU CONTROLLER -->
    <script>
        // Splash Screen Hide Transition
        window.addEventListener("load", function () {
            const splash = document.getElementById("puzzleSplash");
            if (!splash) return;

            setTimeout(function () {
                splash.classList.add("splashHidden");
            }, 3000);
        });

        // Navigation Handlers
        function startGame() {
            window.location.href = "game.html";
        }

        function openLevels() {
            window.location.href = "levels.html";
        }

        function openSettings() {
            const popup = document.getElementById("settingsPopup");
            if (popup) popup.classList.remove("hidden");
        }

        function closeSettings() {
            const popup = document.getElementById("settingsPopup");
            if (popup) popup.classList.add("hidden");
        }

        function resetProgress() {
            if (confirm("Are you sure you want to reset all game progress?")) {
                localStorage.clear();
                location.reload();
            }
        }

        function showAbout() {
            alert("PixVinz PuzzleMania v1.0\nBuilt for smooth web puzzle gameplay.");
        }

        function logout() {
            localStorage.removeItem("currentUser");
            window.location.href = "login.html";
        }
    </script>

</body>
</html>
