<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>PuzzleMania</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">

</head>

<body>


<!-- ======================================
     PUZZLEMANIA OPENING LOGO
     ====================================== -->

<div id="puzzleSplash">

    <img
        src="images/logo.png"
        alt="PuzzleMania"
        class="splash-logo">

</div>


<!-- ======================================
     MAIN MENU
     ====================================== -->

<div class="menu">


    <!-- ==================================
         PUZZLEMANIA LOGO / TITLE
         ================================== -->

    <img
        src="images/logo.png"
        alt="PuzzleMania"
        class="menu-logo">


    <!-- ==========================
         PLAYER PROFILE
    ========================== -->

    <div id="playerProfile">

        <h3 id="welcomeText">
            Welcome!
        </h3>

        <p id="usernameDisplay"></p>

    </div>


    <p>Piece Together The Fun!</p>


    <button onclick="playClick(); startGame()">
        ▶ PLAY
    </button>


    <button onclick="playClick(); openLevels()">
        🏆 LEVELS
    </button>


    <button onclick="playClick(); openSettings()">
        ⚙ SETTINGS
    </button>


    <button
        class="logout-btn"
        onclick="logout()">

        🚪 Logout

    </button>


</div>


<!-- ==========================
     SETTINGS POPUP
========================== -->

<div id="settingsPopup" class="popup">

    <div class="popup-box">

        <h2>⚙ Settings</h2>


        <div class="setting-row">

            <span>🎵 Music</span>

            <input
                type="checkbox"
                id="musicToggle">

        </div>


        <div class="setting-row">

            <span>🔊 Sound Effects</span>

            <input
                type="checkbox"
                id="soundToggle">

        </div>


        <div class="setting-row">

            <span>✨ Animations</span>

            <input
                type="checkbox"
                id="animationToggle">

        </div>


        <button onclick="resetProgress()">
            🗑 Reset Progress
        </button>


        <button onclick="showAbout()">
            ℹ About
        </button>


        <button onclick="closeSettings()">
            ❌ Close
        </button>


    </div>

</div>


<!-- ======================================
     JAVASCRIPT
     ====================================== -->

<script src="audio.js"></script>

<script src="auth.js"></script>

<script src="save.js"></script>

<script src="script.js"></script>


<!-- ======================================
     LOGO SPLASH CONTROL
     ====================================== -->

<script>

window.addEventListener("load", function(){

    const splash =
        document.getElementById("puzzleSplash");


    if(!splash){

        return;

    }


    setTimeout(function(){

        splash.classList.add("splashHidden");

    }, 4000);


});

</script>


</body>

</html>
