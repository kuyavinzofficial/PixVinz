<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>PixVinz</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


<!-- ======================================
     PIXVINZ OPENING SPLASH
     ====================================== -->

<div id="puzzleSplash">

    <video
        class="splash-logo"
        autoplay
        muted
        playsinline>

        <source
            src="images/logo.webm"
            type="video/webm">

    </video>

</div>


<!-- ======================================
     MAIN MENU
     ====================================== -->

<div class="menu">


    <!-- ==================================
         PIXVINZ ANIMATED LOGO
         ================================== -->

    <video
        class="app-logo"
        autoplay
        muted
        loop
        playsinline>

        <source
            src="images/logo.webm"
            type="video/webm">

    </video>


    <!-- ==========================
         PLAYER PROFILE
         ========================== -->

    <div id="playerProfile">

        <h3 id="welcomeText">
            Welcome!
        </h3>

        <p id="usernameDisplay"></p>

    </div>


    <!-- ==========================
         TAGLINE
         ========================== -->

    <p>
        Piece Together The Fun!
    </p>


    <!-- ==========================
         PLAY
         ========================== -->

    <button
        onclick="playClick(); startGame()">

        ▶ PLAY

    </button>


    <!-- ==========================
         LEVELS
         ========================== -->

    <button
        onclick="playClick(); openLevels()">

        🏆 LEVELS

    </button>


    <!-- ==========================
         SETTINGS
         ========================== -->

    <button
        onclick="playClick(); openSettings()">

        ⚙ SETTINGS

    </button>


    <!-- ==========================
         LOGOUT
         ========================== -->

    <button
        class="logout-btn"
        onclick="logout()">

        🚪 Logout

    </button>


</div>


<!-- ======================================
     SETTINGS POPUP
     ====================================== -->

<div
    id="settingsPopup"
    class="popup">


    <div class="popup-box">


        <h2>
            ⚙ Settings
        </h2>


        <!-- ==========================
             MUSIC
             ========================== -->

        <div class="setting-row">

            <span>
                🎵 Music
            </span>

            <input
                type="checkbox"
                id="musicToggle">

        </div>


        <!-- ==========================
             SOUND
             ========================== -->

        <div class="setting-row">

            <span>
                🔊 Sound Effects
            </span>

            <input
                type="checkbox"
                id="soundToggle">

        </div>


        <!-- ==========================
             ANIMATIONS
             ========================== -->

        <div class="setting-row">

            <span>
                ✨ Animations
            </span>

            <input
                type="checkbox"
                id="animationToggle">

        </div>


        <!-- ==========================
             RESET PROGRESS
             ========================== -->

        <button
            onclick="resetProgress()">

            🗑 Reset Progress

        </button>


        <!-- ==========================
             ABOUT
             ========================== -->

        <button
            onclick="showAbout()">

            ℹ About

        </button>


        <!-- ==========================
             CLOSE
             ========================== -->

        <button
            onclick="closeSettings()">

            ❌ Close

        </button>


    </div>

</div>


<!-- ======================================
     JAVASCRIPT
     ====================================== -->

<script src="audio.js"></script>

<script src="auth.js"></script>

<script src="save.js"></script>

<script src="script.js"></script>


<!-- ======================================
     SPLASH CONTROL
     ====================================== -->

<script>

window.addEventListener("load", function(){

    const splash =
        document.getElementById("puzzleSplash");


    if(!splash){

        return;

    }


    /*
       Let the PixVinz logo play first.
       Adjust this number later if needed.
    */

    setTimeout(function(){

        splash.classList.add(
            "splashHidden"
        );

    }, 4000);

});

</script>


</body>

</html>
