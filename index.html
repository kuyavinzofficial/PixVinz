<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>PixVZinz</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>


<!-- =========================================================
     OPENING SPLASH
     ========================================================= -->

<div id="puzzleSplash">

    <video
        class="app-logo"
        autoplay
        muted
        playsinline
        loop
    >
        <source
            src="image/logo.webm"
            type="video/webm"
        >
    </video>

</div>


<!-- =========================================================
     LOGIN / SIGNUP AREA
     ========================================================= -->

<div class="menu" id="authContainer">


    <!-- ==========================
         LOGO
         ========================== -->

    <video
        class="app-logo"
        autoplay
        muted
        playsinline
        loop
    >
        <source
            src="image/logo.webm"
            type="video/webm"
        >
    </video>


    <!-- ==========================
         LOGIN
         ========================== -->

    <div id="loginScreen">

        <h2>Welcome Back!</h2>

        <p>
            Log in to continue playing.
        </p>


        <input
            type="text"
            id="loginUsername"
            placeholder="Username"
            autocomplete="username"
        >


        <input
            type="password"
            id="loginPassword"
            placeholder="Password"
            autocomplete="current-password"
        >


        <button
            type="button"
            id="loginBtn"
        >
            Log In
        </button>


        <button
            type="button"
            id="showSignupBtn"
        >
            Create Account
        </button>

    </div>


    <!-- ==========================
         SIGN UP
         ========================== -->

    <div
        id="signupScreen"
        style="display:none;"
    >

        <h2>Create Account</h2>

        <p>
            Start your PixVZinz journey.
        </p>


        <input
            type="text"
            id="signupUsername"
            placeholder="Choose a username"
            autocomplete="username"
        >


        <input
            type="password"
            id="signupPassword"
            placeholder="Create a password"
            autocomplete="new-password"
        >


        <input
            type="password"
            id="signupConfirmPassword"
            placeholder="Confirm password"
            autocomplete="new-password"
        >


        <button
            type="button"
            id="signupBtn"
        >
            Sign Up
        </button>


        <button
            type="button"
            id="showLoginBtn"
        >
            Back to Log In
        </button>

    </div>


    <!-- ==========================
         AUTH MESSAGE
         ========================== -->

    <p
        id="authMessage"
        aria-live="polite"
    ></p>


</div>


<!-- =========================================================
     MAIN MENU
     ========================================================= -->

<div
    class="menu"
    id="mainMenu"
    style="display:none;"
>


    <!-- ==========================
         LOGO
         ========================== -->

    <video
        class="app-logo"
        autoplay
        muted
        playsinline
        loop
    >
        <source
            src="image/logo.webm"
            type="video/webm"
        >
    </video>


    <!-- ==========================
         PLAYER PROFILE
         ========================== -->

    <div id="playerProfile">

        <h3 id="welcomeText">
            Welcome!
        </h3>

        <p id="usernameDisplay"></p>

    </div>


    <!-- ==========================
         TAGLINE
         ========================== -->

    <p>
        Piece Together The Fun!
    </p>


    <!-- ==========================
         COINS
         ========================== -->

    <div class="coins">

        🪙
        <span id="coinDisplay">
            0
        </span>

    </div>


    <!-- ==========================
         START GAME
         ========================== -->

    <button
        type="button"
        id="startGameBtn"
    >
        Play Game
    </button>


    <!-- ==========================
         LEVELS
         ========================== -->

    <button
        type="button"
        id="levelsBtn"
    >
        Levels
    </button>


    <!-- ==========================
         SETTINGS
         ========================== -->

    <button
        type="button"
        id="settingsBtn"
    >
        Settings
    </button>


    <!-- ==========================
         ABOUT
         ========================== -->

    <button
        type="button"
        id="aboutBtn"
    >
        About PixVZinz
    </button>


    <!-- ==========================
         LOGOUT
         ========================== -->

    <button
        type="button"
        class="logout-btn"
        id="logoutBtn"
    >
        Log Out
    </button>


</div>


<!-- =========================================================
     SETTINGS POPUP
     ========================================================= -->

<div
    class="popup"
    id="settingsPopup"
    style="display:none;"
>

    <div class="popup-box">

        <h2>Settings</h2>


        <div class="setting-row">

            <span>
                Sound
            </span>

            <input
                type="checkbox"
                id="soundToggle"
                checked
            >

        </div>


        <div class="setting-row">

            <span>
                Music
            </span>

            <input
                type="checkbox"
                id="musicToggle"
                checked
            >

        </div>


        <button
            type="button"
            id="closeSettingsBtn"
        >
            Close
        </button>

    </div>

</div>


<!-- =========================================================
     ABOUT POPUP
     ========================================================= -->

<div
    id="aboutBox"
    style="display:none;"
>

    <div class="about-content">


        <button
            type="button"
            class="about-close"
            id="closeAboutBtn"
        >
            ×
        </button>


        <video
            class="about-logo"
            autoplay
            muted
            playsinline
            loop
        >
            <source
                src="image/logo.webm"
                type="video/webm"
            >
        </video>


        <h2>
            PixVZinz
        </h2>


        <p>
            Piece Together The Fun!
        </p>


        <p>
            Challenge yourself,
            complete puzzles,
            earn stars,
            and collect coins.
        </p>

    </div>

</div>


<!-- =========================================================
     SCRIPTS
     ========================================================= -->

<script src="audio.js"></script>

<script src="auth.js"></script>

<script src="save.js"></script>

<script src="script.js"></script>


</body>

</html>
